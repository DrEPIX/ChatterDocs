<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatterDocs Portal</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="app">
    <aside class="servers" id="servers"></aside>
    <aside class="channels">
      <header>
        <div>
          <h1>ChatterDocs</h1>
          <p class="subtitle">Chat + Minecraft</p>
        </div>
        <button id="themeToggle">Toggle Theme</button>
      </header>
      <div class="channel-list" id="rooms"></div>
      <div class="friends-panel">
        <div class="friends-header">
          <h3>Friends</h3>
          <button id="refreshFriendsBtn">Refresh</button>
        </div>
        <div class="friend-add">
          <input type="email" id="friendEmail" placeholder="Add friend by email" />
          <button id="addFriendBtn">Add</button>
        </div>
        <div class="friend-list" id="friendsList"></div>
        <div class="friend-requests" id="friendRequests"></div>
      </div>
      <footer class="profile">
        <div id="userInfo"></div>
        <div class="auth">
          <div id="googleSignIn"></div>
          <button id="devSignInBtn" hidden>Quick Dev Login</button>
          <button id="logoutBtn">Logout</button>
        </div>
      </footer>
    </aside>
    <main class="content">
      <section class="content-header">
        <div>
          <h2 id="roomTitle">Select a room</h2>
          <p id="roomSubtitle"></p>
        </div>
        <div class="actions"></div>
      </section>
      <section class="content-body">
        <div class="messages" id="messages"></div>
        <div class="game" id="gamePanel" hidden>
          <div class="game-header">
            <div>
              <h3>Minecraft Web Client</h3>
              <p class="muted">Play directly in this room when a web client URL is configured.</p>
            </div>
            <button id="launchGameBtn">Launch</button>
          </div>
          <div class="game-embed" id="gameEmbed">Waiting for connection...</div>
          <div class="game-info" id="gameInfo"></div>
        </div>
      </section>
      <section class="composer">
        <input type="text" id="messageInput" placeholder="Send a message" maxlength="240" />
        <label class="toggle"><input type="checkbox" id="profanityToggle" checked /> Profanity filter</label>
        <label class="toggle"><input type="checkbox" id="blurImagesToggle" /> Blur images</label>
        <button id="sendBtn">Send</button>
      </section>
    </main>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
